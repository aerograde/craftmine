name: Deploy web client to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      # Set before stable, which takes over as the default: `web/build.sh`
      # selects the pin itself with `cargo +nightly-2026-10-14`.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-14
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: pages-web
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Download pinned Minecraft files
        run: python3 tools/prepare_pages_resources.py .local/minecraft/26.3
      - name: Prepare Horizon resources
        run: |
          cargo run --release -p horizon-prepare -- \
            --prepare \
            --client-jar .local/minecraft/26.3/client.jar \
            --server-jar .local/minecraft/26.3/server.jar \
            --version-json .local/minecraft/26.3/manifest.json \
            --libraries-dir .local/minecraft/26.3/libraries \
            --assets-dir .local/minecraft/26.3/assets \
            --java-home "$JAVA_HOME" \
            --root . \
            --output .local/horizon-client/26.3
      - name: Build the web folder
        run: |
          # `pkg` is the threaded build, which the page runs when it is
          # cross-origin isolated (`main.js`), as the service worker makes it:
          # chunk generation, lighting and meshing then run on Web Workers.
          # `pkg-st` is the fallback for pages that are not isolated.
          #
          # Building `THREADS=0` into both slots left every player on the
          # single-threaded module, whose jobs all run on the page's own thread
          # a few milliseconds a frame: a world took minutes to load and the
          # frame rate collapsed, which read as a hang at "Loading terrain".
          PROFILE=fast web/build.sh
          THREADS=0 PROFILE=fast DIST=web/dist-st CARGO_TARGET_DIR=target/web-st web/build.sh
          python3 web/package.py folder --no-build
          touch web/out/horizon-web/.nojekyll
      - uses: actions/configure-pages@v5
      # v3 uploads through the legacy artifact backend, which `deploy-pages@v4` cannot see: the
      # artifact is uploaded (the run lists `github-pages`, 68 MB) and the deploy still reports
      # "Found 0 artifact(s)". Both must be the v4 API.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/out/horizon-web
      - id: deployment
        uses: actions/deploy-pages@v4
