# render layer overrides (Iris: forces the chunk layer per block, overriding
# the one Minecraft derives from the textures). Resource packs that hide data
# in texture alpha (Vanilla Tweaks wavy leaves/plants: marker pixels at alpha
# 1, 2, 16, 252, 253...) make Minecraft classify foliage as TRANSLUCENT - it
# then renders through gbuffers_water (glass reflections, no shadows). Foliage
# is cutout in vanilla: keep it there whatever the resource pack does
