# colored light propagation (LPV): how a block treats light passing through it.
# every other terrain block with a vertex on a block-grid corner (full cubes,
# slabs, stairs...) is opaque; thin shapes (panes, fences, rails, plants)
# are open automatically. a block may be in only ONE group: the copper doors
# and trapdoors were moved here from the copper reflectivity groups
# open: full-size or wall/floor-hugging shapes that must not block light
# (vanilla "filtered light" 0 per the Java 1.21.9 block report: shelves,
# hopper, composter, lectern, stonecutter, daylight detector; cauldrons
# (20001) and unlit campfires are opened in shadow.vsh)
# lit-state groups (10203 redstone torch, 10207 redstone lamp, 10210
# furnaces) list only lit=true: an unlit one carries no light id at all, so
# nothing that cannot read the state (Voxy LODs) can make it glow
block.10230 = glass glass_pane snow moss_carpet pale_moss_carpet scaffolding %doors %trapdoors %wool_carpets copper_grate exposed_copper_grate oxidized_copper_grate waxed_copper_grate waxed_exposed_copper_grate waxed_oxidized_copper_grate waxed_weathered_copper_grate weathered_copper_grate ice frosted_ice mangrove_roots barrier oak_shelf spruce_shelf birch_shelf jungle_shelf acacia_shelf dark_oak_shelf mangrove_shelf cherry_shelf pale_oak_shelf bamboo_shelf crimson_shelf warped_shelf composter hopper lectern stonecutter daylight_detector
