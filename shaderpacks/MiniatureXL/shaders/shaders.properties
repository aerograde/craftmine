# Miniature XL 1.2
# Based on Miniature Shader 2.19 by Mateus A. Kreuch (MIT License - see LICENSE)
# XL additions: selective glow, voxel colored lighting (all dimensions),
# entity/item lights, sky colors, day-night shadows, Voxy integration
# quality profiles. MEDIUM = the shader.h defaults (keep them in sync:
# Iris shows a profile as selected only while every option it lists matches).
# they set performance options only; looks (glow colors, lighting style,
# fog, waving...) are left to the user
profile.LOW=shadowMapResolution=512 shadowDistance=64.0 shadowIntervalSize=7.0 SHADOW_ENTITY=0 ENABLE_SHADOWS BLOCK_REFLECTIONS=0 SSR_STEP_SIZE=2.0 SSR_MAX_STEPS=8 SSR_BINARY_STEPS=2 BLOOM BLOOM_QUALITY=0 !BLOOM_PARTICLES COLORED_LIGHT VOXEL_SIZE=64 CL_BEHIND_DISTANCE=24 !SUN_SHAFTS
profile.MEDIUM=shadowMapResolution=1024 shadowDistance=128.0 shadowIntervalSize=7.0 SHADOW_ENTITY=1 ENABLE_SHADOWS BLOCK_REFLECTIONS=5 SSR_STEP_SIZE=1.6 SSR_MAX_STEPS=10 SSR_BINARY_STEPS=4 BLOOM BLOOM_QUALITY=1 BLOOM_PARTICLES COLORED_LIGHT VOXEL_SIZE=128 CL_BEHIND_DISTANCE=32 SUN_SHAFTS
profile.HIGH=shadowMapResolution=2048 shadowDistance=192.0 shadowIntervalSize=7.0 SHADOW_ENTITY=1 ENABLE_SHADOWS BLOCK_REFLECTIONS=5 SSR_STEP_SIZE=1.2 SSR_MAX_STEPS=16 SSR_BINARY_STEPS=8 BLOOM BLOOM_QUALITY=2 BLOOM_PARTICLES COLORED_LIGHT VOXEL_SIZE=192 CL_BEHIND_DISTANCE=32 SUN_SHAFTS

